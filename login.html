<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #f8f9fc;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .login-card {
            max-width: 1000px;
            width: 100%;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        .login-row {
            display: flex;
            flex-wrap: wrap;
        }
        
        .login-left {
            flex: 1;
            background-color: var(--primary-color);
            background-image: linear-gradient(135deg, var(--primary-color) 0%, #3f51b5 100%);
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-left::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.1)"/></svg>');
            transform: rotate(30deg);
            z-index: 0;
        }
        
        .login-left-content {
            position: relative;
            z-index: 1;
        }
        
        .login-right {
            flex: 1;
            padding: 3rem;
        }
        
        .login-logo {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        
        .login-tagline {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .login-features {
            margin-top: 2rem;
        }
        
        .login-feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .login-feature-icon {
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }
        
        .login-form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .form-floating {
            margin-bottom: 1.5rem;
        }
        
        .form-floating > .form-control {
            padding: 1rem 0.75rem;
        }
        
        .form-floating > label {
            padding: 1rem 0.75rem;
        }
        
        .btn-login {
            padding: 0.75rem 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0.5rem;
            color: white;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .social-btn-facebook {
            background-color: #3b5998;
        }
        
        .social-btn-google {
            background-color: #db4437;
        }
        
        .social-btn-twitter {
            background-color: #1da1f2;
        }
        
        .social-btn-linkedin {
            background-color: #0077b5;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .divider-line {
            flex-grow: 1;
            height: 1px;
            background-color: #e0e0e0;
        }
        
        .divider-text {
            padding: 0 1rem;
            color: #9e9e9e;
            font-size: 0.9rem;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9e9e9e;
            z-index: 10;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }
        
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 991.98px) {
            .login-left {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-row">
                <!-- Left Side - Branding & Features -->
                <div class="login-left">
                    <div class="login-left-content">
                        <div class="login-logo">
                            <i class="fas fa-tachometer-alt me-2"></i>Admin Panel
                        </div>
                        <div class="login-tagline">
                            Powerful admin dashboard to manage your business efficiently
                        </div>
                        <div class="login-features">
                            <div class="login-feature-item">
                                <div class="login-feature-icon">
                                    <i class="fas fa-shield-alt"></i>
                                </div>
                                <div>Secure authentication system</div>
                            </div>
                            <div class="login-feature-item">
                                <div class="login-feature-icon">
                                    <i class="fas fa-tachometer-alt"></i>
                                </div>
                                <div>Intuitive dashboard interface</div>
                            </div>
                            <div class="login-feature-item">
                                <div class="login-feature-icon">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <div>Comprehensive analytics & reports</div>
                            </div>
                            <div class="login-feature-item">
                                <div class="login-feature-icon">
                                    <i class="fas fa-mobile-alt"></i>
                                </div>
                                <div>Fully responsive design</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Right Side - Login Form -->
                <div class="login-right">
                    <h4 class="login-form-title">Sign In to Your Account</h4>
                    
                    <!-- Social Login Buttons -->
                    <div class="social-login">
                        <a href="#" class="social-btn social-btn-facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-btn social-btn-google">
                            <i class="fab fa-google"></i>
                        </a>
                        <a href="#" class="social-btn social-btn-twitter">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="social-btn social-btn-linkedin">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                    </div>
                    
                    <!-- Divider -->
                    <div class="divider">
                        <div class="divider-line"></div>
                        <div class="divider-text">or sign in with email</div>
                        <div class="divider-line"></div>
                    </div>
                    
                    <!-- Login Form -->
                    <form id="login-form">
                        <div id="login-alert" class="alert d-none"></div>
                        
                        <!-- Email Field -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <label for="email">Email address</label>
                        </div>
                        
                        <!-- Password Field -->
                        <div class="form-floating mb-3 position-relative">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                            <span class="password-toggle" id="toggle-password">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        
                        <!-- Remember Me & Forgot Password -->
                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember-me">
                                <label class="form-check-label" for="remember-me">Remember me</label>
                            </div>
                            <div class="forgot-password">
                                <a href="#" class="text-primary">Forgot password?</a>
                            </div>
                        </div>
                        
                        <!-- Login Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-login">Sign In</button>
                        </div>
                        
                        <!-- Register Link -->
                        <div class="register-link">
                            Don't have an account? <a href="#" class="text-primary">Register here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- SweetAlert2 for notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Form submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loading state
            const loginBtn = this.querySelector('.btn-login');
            const originalBtnText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Signing in...';
            loginBtn.disabled = true;
            
            // Simulate login process
            setTimeout(function() {
                // Reset button state
                loginBtn.innerHTML = originalBtnText;
                loginBtn.disabled = false;
                
                // Redirect to dashboard (in a real app, this would happen after successful authentication)
                window.location.href = 'dashboard.html';
            }, 2000);
        });
    </script>
</body>
</html>
